# Сниппет для Nginx: сжатие, кэш и базовые заголовки безопасности.
# Положить в /etc/nginx/snippets/myfreelab-static.conf
# и подключить строкой `include snippets/myfreelab-static.conf;`
# внутри блока server { listen 443 ssl; ... } сайта myfreelab.ru.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Файлы сборки Vite имеют хэш в имени — их можно кэшировать надолго
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location /images/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# index.html всегда свежий, чтобы обновления были видны сразу
location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}
